<script>
'use strict';

const MAP={w:720,h:1120};

 {id:'aisa',name:'Aisa',request:'My back hurts from carrying water.',thanks:'Thank you, I feel so much lighter.',x:188,y:279,part:'back',color:'#b34d3c',hair:'#39241d',skin:'#d59b70',dress:'#e8b47d'},

 {id:'temir',name:'Temir',request:'My shoulders are stiff as old wood.',thanks:'My shoulders can finally rest. Thank you!',x:557,y:777,part:'back',color:'#426b79',hair:'#30231c',skin:'#c68861',dress:'#6f9ca0'},
 {id:'aliya',name:'Aliya',request:'I feel a little sad today.',thanks:'You brought a little sunshine back. Thank you.',x:363,y:956,part:'arm',color:'#b6853b',hair:'#4b2b21',skin:'#d99e76',dress:'#e8bd68'}
];
let player={x:355,y:536,dir:'down',walk:0,step:0};let healed=new Set(JSON.parse(localStorage.getItem('emberheart-healed')||'[]'));let active=null,healAnim=null,near=null,lastTime=0,toastTimer=0,frame=0;const keys=new Set(),touch=new Set();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

new ResizeObserver(resize).observe(scene);resize();
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function path(points,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}

function drawGround(){
 box(0,0,MAP.w,MAP.h,'#92734b');
 // warm grass blocks and speckles
 for(let y=10;y<MAP.h;y+=46)for(let x=(y%3)*17;x<MAP.w;x+=53){let v=(x*13+y*7)%7;if(v<4)box(x,y,14+v*2,2,v===0?'#ab8754':'#9d7c4e')}

 path([[291,40],[426,40],[440,172],[392,263],[438,374],[416,500],[459,601],[426,730],[458,857],[416,1070],[275,1090],[310,928],[272,807],[307,689],[270,565],[303,425],[262,307],[303,194]],'#c39764');
 path([[303,50],[405,50],[415,175],[368,258],[411,378],[390,496],[430,601],[397,725],[431,855],[389,1058],[302,1068],[337,925],[300,808],[335,689],[299,567],[333,424],[292,308],[333,195]],'#d2a977');
 // cobbles on path
 for(let i=0;i<55;i++){let y=65+i*19,x=348+Math.sin(y*.018)*36+Math.sin(y*.044)*20;box(x,y,8+(i%3)*3,2,i%2?'#b98e60':'#d9b786')}
 // little garden patches
 drawGarden(75,425,105,107);drawGarden(538,570,111,125);drawGarden(78,865,105,125);
 // decorative grass tufts and flowers deterministic
 for(let i=0;i<92;i++){let x=(i*83+21)%MAP.w,y=(i*137+87)%MAP.h;if((x>260&&x<460)||((x>70&&x<195)&&(y>415&&y<545))||((x>520&&x<660)&&(y>560&&y<710)))continue;box(x,y,2,7,'#506442');box(x+3,y-2,2,7,'#71834b');if(i%9===0){box(x+2,y-5,3,3,i%18?'#f0b968':'#e78665')}}
 // warm low sun wash
}

function drawHouse(x,y,w,h,variant=0){
 // shadow and foundation

 // wall and side panels

 // roof silhouette
 path([[x-8,y+42],[x+w/2,y-10],[x+w+8,y+42],[x+w-3,y+51],[x+w/2,y+7],[x+3,y+51]],'#6b352b');path([[x-8,y+42],[x+w/2,y-10],[x+w/2,y+7],[x+3,y+51]],'#9b4934');path([[x+w/2,y-10],[x+w+8,y+42],[x+w-3,y+51],[x+w/2,y+7]],'#79382e');
 // roof tile lines
 for(let i=0;i<5;i++){let yy=y+9+i*8;box(x+7+i*2,yy,w-14-i*4,2,i%2?'#ae6240':'#b96b44');box(x+w/2-2,yy-1,4,3,'#d08151')}
 // door, window, trim
 box(x+w/2-13,y+h-48,26,34,'#523128');box(x+w/2-9,y+h-44,18,30,'#71412d');box(x+w/2+4,y+h-29,3,3,'#efbd70');
 box(x+25,y+58,25,24,'#633a2c');box(x+28,y+61,19,18,'#f2bd70');box(x+36,y+61,3,18,'#75432c');box(x+28,y+69,19,3,'#75432c');
 box(x+w-48,y+58,25,24,'#633a2c');box(x+w-45,y+61,19,18,'#f2bd70');box(x+w-37,y+61,3,18,'#75432c');box(x+w-45,y+69,19,3,'#75432c');
 box(x+7,y+39,w-14,4,'#e1ac70');
}

 // market cart and baskets
 ellipse(235,597,30,7,'#422a2450');box(205,568,57,27,'#885336');box(209,564,49,9,'#c0834c');box(212,573,5,22,'#60402c');box(249,573,5,22,'#60402c');ellipse(215,599,6,6,'#49362c');ellipse(252,599,6,6,'#49362c');box(214,556,10,8,'#a6a057');box(229,553,12,11,'#cc7550');box(244,557,9,7,'#d8ad5b');worldText('MARKET',233,618,'#f5d5a5',8);
 // lampposts
 for(const [x,y] of [[255,340],[472,510],[249,902],[465,1005]]){ellipse(x,y+21,13,5,'#523c2c55');box(x-2,y-9,4,30,'#573b2d');box(x-8,y-16,16,10,'#573b2d');box(x-5,y-14,10,6,'#f9c374');box(x-3,y-12,6,3,'#fff0ad')}
}
function drawPersonSprite(x,y,color,skin,hair,dir='down',walk=0,isPlayer=false,healedFlag=false){
 const bounce=walk?Math.sin(walk)*1.5:0; y+=bounce;
 ellipse(x,y+14,11,4,'#38241e70');
 // feet

 // head

 if(dir==='down'){box(x-8,y-17,16,6,hair);box(x-6,y-11,3,2,hair);box(x-4,y-9,2,2,'#39231f');box(x+3,y-9,2,2,'#39231f')}

 else {box(x-8,y-17,15,7,hair);if(dir==='left'){box(x-8,y-13,5,6,hair);box(x-7,y-10,2,2,'#39231f')}else{box(x+1,y-13,6,6,hair);box(x+4,y-10,2,2,'#39231f')}}
 if(isPlayer){box(x-4,y-4,8,5,'#f3d9b0');box(x-2,y-4,4,2,'#d79f6f');box(x-5,y-15,10,2,'#f3c477')}

function draw(){const scale=canvas.width/360,h=canvas.height/scale;ctx.setTransform(scale,0,0,scale,0,0);const camX=clamp(player.x-180,0,MAP.w-360),camY=clamp(player.y-h*.55,0,MAP.h-h);ctx.fillStyle='#92734b';ctx.fillRect(0,0,360,h);ctx.save();ctx.translate(-camX,-camY);drawVillage();for(const n of people)drawNpc(n);if(healAnim)drawHealingEffect();else drawPlayer();ctx.restore();
 // soft retro pixel glow in world; scene info in DOM
 near=nearest();const available=!active&&!healAnim;
 document.querySelector('#interactTitle').textContent=active?'CONTINUE':healAnim?'HEALING…':near?(healed.has(near.id)?'SAY HELLO':'TALK TO '+near.name.toUpperCase()):'LOOK AROUND';

function drawHealingEffect(){
 const a=healAnim,n=people.find(p=>p.id===a.id);if(!n)return;
 const t=a.elapsed,phase=t<1.35?0:t<2.8?1:2;
 const targetX=n.part==='arm'?n.x+9:n.part==='leg'?n.x+6:n.x;
 const targetY=n.part==='back'?n.y-1:n.part==='arm'?n.y-2:n.y+10;
 // Gather warm embers around the little iron brazier, then carry that warmth to the ache.
 if(phase===0){
  const hx=n.x-22,hy=n.y+7;
  drawPersonSprite(hx-13,hy,'#c05b3a','#d7a078','#38241d','right',Math.sin(t*9)*.35,true,false);
  ellipse(hx,hy+7,17,5,'#38241e70');box(hx-10,hy+3,20,7,'#674234');box(hx-7,hy,14,4,'#b9a79a');
  ellipse(hx,hy,8+Math.sin(t*14)*2,4,'#f77e38a8');box(hx-4,hy-2,8,3,'#ffd27a');
  for(let i=0;i<4;i++){const yy=hy-8-((t*16+i*5)%18);box(hx-1+(i%2?4:-4),yy,2,4,i%2?'#ffc56c':'#f18a48')}
  for(let i=0;i<5;i++){const q=(t*1.1+i/5)%1;const xx=hx+q*22,yy=hy-8-Math.sin(q*Math.PI)*15;box(xx,yy,3,3,i%2?'#ffcf78':'#f18a48')}
 }else{
  const healerX=n.x+20,healerY=n.y+1;
  drawPersonSprite(healerX,healerY,'#c05b3a','#d7a078','#38241d','left',Math.sin(t*10)*.45,true,false);
  const pulse=12+Math.sin(t*16)*3;
  ellipse(targetX,targetY,pulse,6+Math.sin(t*16)*2,'#ffd16a80');
  // A careful, cushioned step: a warm boot briefly rests over the glowing treatment point.
  box(targetX-5,targetY-2,11,7,'#65432e');box(targetX-4,targetY-3,8,3,'#c05b3a');
  if(Math.floor(t*5)%2===0){box(targetX+12,targetY-12,3,3,'#fff0aa');box(targetX-14,targetY-10,3,3,'#ffb35e');box(targetX+1,targetY-17,2,2,'#ffc56c')}
 }
}
function popToast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function showDialog(n){active=n;const box=document.querySelector('#dialogue');box.hidden=false;document.querySelector('#speaker').textContent=healed.has(n.id)?`${n.name} · FEELING BETTER`:`${n.name} · VILLAGER`;
 document.querySelector('#dialogueText').textContent=healed.has(n.id)?n.thanks:`“${n.request}”`;
 const actions=document.querySelector('#actions');actions.innerHTML='';
 if(healed.has(n.id)){const done=document.createElement('button');done.className='action';done.textContent='Lovely to see you';done.onclick=closeDialog;actions.append(done)}else{const heal=document.createElement('button');heal.className='action';heal.innerHTML='✦ &nbsp; Offer Fire Qigong';heal.onclick=()=>beginHealing(n);const later=document.createElement('button');later.className='action secondary';later.textContent='Maybe later';later.onclick=closeDialog;actions.append(heal,later)}
}
function closeDialog(){active=null;document.querySelector('#dialogue').hidden=true}
function beginHealing(n){closeDialog();healAnim={id:n.id,elapsed:0};player.dir='right';popToast('A quiet moment by the village hearth')}
function finishHealing(){const n=people.find(p=>p.id===healAnim?.id);if(!n)return;healed.add(n.id);localStorage.setItem('emberheart-healed',JSON.stringify([...healed]));healAnim=null;showDialog(n);document.querySelector('#speaker').textContent=`${n.name} · WITH GRATITUDE`;document.querySelector('#dialogueText').textContent=n.thanks;document.querySelector('#actions').innerHTML='';const next=document.createElement('button');next.className='action';next.textContent=healed.size===people.length?'The village is well ✦':'Continue exploring';next.onclick=()=>{closeDialog();if(healed.size===people.length){popToast('Every heart in the village is a little lighter ✦')}};document.querySelector('#actions').append(next)}
function doInteract(){if(healAnim)return;if(active){const button=document.querySelector('#actions .action');button?.click();return}if(near)showDialog(near);else popToast('Wander the paths and look for a villager')}
document.querySelector('#interact').addEventListener('click',doInteract);document.querySelector('#close').addEventListener('click',closeDialog);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'){closeDialog();return}if(['e','E',' ','Enter'].includes(e.key)){if(!e.repeat)doInteract();return}keys.add(e.key.toLowerCase())});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
for(const btn of document.querySelectorAll('.pad-btn')){const dir=btn.dataset.dir;const down=e=>{e.preventDefault();touch.add(dir);btn.classList.add('pressed');btn.setPointerCapture?.(e.pointerId)};const up=e=>{e.preventDefault();touch.delete(dir);btn.classList.remove('pressed')};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)}
function tick(now){const dt=Math.min(.04,(now-lastTime)/1000||0);lastTime=now;frame+=dt;
 if(healAnim){healAnim.elapsed+=dt;if(healAnim.elapsed>4.1)finishHealing()}
 else if(!active){let dx=(keys.has('d')||keys.has('arrowright')||touch.has('right')?1:0)-(keys.has('a')||keys.has('arrowleft')||touch.has('left')?1:0),dy=(keys.has('s')||keys.has('arrowdown')||touch.has('down')?1:0)-(keys.has('w')||keys.has('arrowup')||touch.has('up')?1:0);if(dx||dy){let len=Math.hypot(dx,dy);player.x=clamp(player.x+dx/len*dt*130,18,MAP.w-18);player.y=clamp(player.y+dy/len*dt*130,25,MAP.h-22);player.walk+=dt*13;player.step=Math.sin(player.walk);player.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down')}else player.walk=0}
 draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
